  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: var(--font-body);
    color: var(--ink-darkest);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #DBEAFE 0%, transparent 60%),
      linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 40%, #ECFEFF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  button { font-family: inherit; }

  /* ============================================
     APP CONTAINER
     ============================================ */
  .app {
    width: 100%;
    max-width: 920px;
    background:
      linear-gradient(180deg, #DBEAFE 0%, #E0F2FE 35%, #ECFEFF 70%, #F0FDFA 100%);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lift);
    overflow: hidden;
    position: relative;
    isolation: isolate;
  }

  /* ============================================
     HEADER (overlay on scene)
     ============================================ */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    padding: 24px 28px 12px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: start;
    gap: 16px;
    pointer-events: none;
  }
  .header > * { pointer-events: auto; }

  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .back-btn:hover { transform: translateX(-2px); box-shadow: var(--shadow-card); }
  .back-btn svg { width: 16px; height: 16px; color: var(--ink-darkest); }

  .title-block {
    text-align: center;
    padding-top: 2px;
    text-shadow: 0 1px 12px rgba(255, 255, 255, 0.6);
  }
  .title-icon {
    display: inline-flex;
    width: 28px; height: 28px;
    color: var(--primary);
    animation: float-icon 4s ease-in-out infinite;
  }
  @keyframes float-icon {
    0%, 100% { transform: translateY(0);    opacity: 0.75; }
    50%      { transform: translateY(-4px); opacity: 1; }
  }
  .title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(28px, 4vw, 38px);
    letter-spacing: -0.02em;
    color: var(--ink-darkest);
    margin-top: 2px;
    line-height: 1.05;
  }
  .subtitle {
    font-size: 14px;
    color: var(--ink-dark);
    margin-top: 6px;
    letter-spacing: 0.01em;
  }

  .points-card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 18px;
    border-radius: var(--r-md);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 130px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .points-card .leaf-icon { width: 28px; height: 28px; color: var(--leaf); flex-shrink: 0; }
  .points-value {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
    color: var(--ink-darkest);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .points-label { font-size: 12px; color: var(--ink-mid); margin-top: 3px; }
  .points-card.pulse { animation: points-pulse 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes points-pulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(132, 204, 22, 0.18), var(--shadow-card); }
    100% { transform: scale(1); box-shadow: var(--shadow-soft); }
  }

  /* ============================================
     SCENE + CURVY ROAD
     ============================================ */
  .scene {
    position: relative;
    z-index: 1;
    width: 100%;
    aspect-ratio: 1402 / 1122;
    max-height: 600px;

    background-image: var(--scene-bg);
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* SVG that draws the journey path on top of the illustration.
     Uses preserveAspectRatio="xMidYMid slice" so it crops identically
     to the background image — markers stay perfectly aligned. */
  .journey-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* let clicks pass through to elements below */
    z-index: 2;
  }
  /* Re-enable pointer events on individual marker groups for hover */
  .journey-svg .milestone-marker { pointer-events: auto; cursor: default; }

  /* The unwalked portion of the road — soft dashed line */
  .journey-path-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.85);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 14 14;
    filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.25));
  }

  /* The walked portion — bright gold solid line, animated via dashoffset */
  .journey-path-fill {
    fill: none;
    stroke: url(#pathGradient);
    stroke-width: 8;
    stroke-linecap: round;
    filter: url(#pathGlow);
    transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Milestone marker stones along the road */
  .milestone-marker .marker-bg {
    fill: white;
    stroke: #7DD3FC;
    stroke-width: 3;
    transition: fill 0.5s ease, stroke 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-box: fill-box;
    transform-origin: center;
  }
  .milestone-marker.reached .marker-bg {
    fill: url(#markerGradient);
    stroke: var(--gold);
    transform: scale(1.15);
  }
  .milestone-marker .marker-glow {
    fill: none;
    stroke: var(--gold);
    stroke-width: 3;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .milestone-marker.reached .marker-glow { opacity: 0.45; }
  .milestone-marker .marker-star {
    fill: white;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .milestone-marker.reached .marker-star { opacity: 1; }

  /* The "you are here" pip that slides along the road */
  .position-marker {
    transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .position-marker .pip-outer {
    fill: rgba(255, 255, 255, 0.9);
    animation: pip-pulse 2.2s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .position-marker .pip-inner {
    fill: var(--primary-dark);
  }
  @keyframes pip-pulse {
    0%, 100% { transform: scale(1);   opacity: 0.9; }
    50%      { transform: scale(1.4); opacity: 0.4; }
  }

  /* Celebratory aura over the meditator (visible only during animation) */
  .breath-aura {
    position: absolute;
    top: 50%;
    left: 49%;
    transform: translate(-50%, -50%) scale(1);
    width: 28%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        rgba(253, 224, 71, 0.7) 0%,
        rgba(251, 191, 36, 0.45) 30%,
        rgba(251, 191, 36, 0.15) 55%,
        rgba(251, 191, 36, 0) 75%);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }
  .breath-aura.celebrate { animation: aura-celebrate 1.6s ease-out; }
  @keyframes aura-celebrate {
    0%   { transform: translate(-50%, -50%) scale(0.7); opacity: 0;   }
    25%  { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0;   }
  }

  /* Atmospheric petals */
  .scene-petals {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -20px;
    width: 12px; height: 12px;
    background: radial-gradient(circle at 35% 35%, #FBCFE8 0%, #F9A8D4 60%, #EC4899 100%);
    border-radius: 50% 0 50% 0;
    opacity: 0;
    animation: petal-fall linear infinite;
    filter: drop-shadow(0 1px 2px rgba(236, 72, 153, 0.2));
  }
  @keyframes petal-fall {
    0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.6; }
    100% { transform: translate(var(--drift, 30px), 600px) rotate(720deg); opacity: 0; }
  }

  /* Breath instruction bubble — moved up slightly so it doesn't sit on the road */
  .breath-instruction {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 20px;
    border-radius: 100px;
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 78%;
    z-index: 5;
    transition: all 0.4s ease;
  }
  .breath-instruction .wind-icon { width: 22px; height: 22px; color: var(--primary); flex-shrink: 0; }
  .breath-instruction .text { font-size: 13px; color: var(--ink-dark); line-height: 1.4; transition: opacity 0.4s ease; }

  /* Celebration banner */
  .celebration-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 60%, #D97706 100%);
    color: white;
    padding: 22px 44px;
    border-radius: var(--r-lg);
    box-shadow: 0 24px 60px rgba(217, 119, 6, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.4);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
  }
  .celebration-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .celebration-banner .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.25);
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 8px;
  }
  .celebration-banner .ctitle {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .celebration-banner .csub { font-size: 14px; opacity: 0.95; margin-top: 6px; }

  /* ============================================
     PROGRESS LABELS (below the scene — no bar, just numbers)
     ============================================ */
  .progress-section {
    position: relative;
    z-index: 2;
    padding: 22px 28px 14px;
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .progress-head .current-ms,
  .progress-head .next-ms {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .progress-head .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    font-weight: 600;
  }
  .progress-head .value {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-darkest);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .progress-head .next-ms { text-align: right; }
  .progress-head .next-ms .value { color: var(--primary-dark); }

  .progress-info {
    margin-top: 8px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-mid);
  }
  .progress-info strong {
    color: var(--primary-dark);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================
     CONTROLS
     ============================================ */
  .controls {
    padding: 16px 28px 18px;
    display: flex;
    justify-content: center;
  }
  .start-btn {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 14px 36px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
    transition: all 0.25s ease;
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(14, 165, 233, 0.45);
  }
  .start-btn:active { transform: translateY(0); }
  .start-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
  }
  .start-btn .check-icon { width: 18px; height: 18px; }

  /* ============================================
     STATS BAR
     ============================================ */
  .stats-bar {
    margin: 0 28px 28px;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    border-radius: var(--r-lg);
    padding: 22px 28px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 24px;
    align-items: center;
    color: white;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
    position: relative;
    overflow: hidden;
  }
  .stats-bar::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 60%; height: 200%;
    background: radial-gradient(ellipse, rgba(56, 189, 248, 0.08), transparent 60%);
    pointer-events: none;
  }
  .stat { display: flex; align-items: center; gap: 16px; position: relative; }
  .stat-icon-wrap {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon-wrap.blue {
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
  }
  .stat-icon-wrap.gold {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
  }
  .stat-icon-wrap svg { width: 24px; height: 24px; color: white; }

  .stat-text { display: flex; flex-direction: column; }
  .stat-label {
    font-size: 12px;
    color: #94A3B8;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-divider {
    width: 1px;
    height: 42px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.12), transparent);
  }
  .stat-icon-wrap.bump { animation: stat-bump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes stat-bump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ============================================
     CONFETTI OVERLAY
     ============================================ */
  .confetti-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    top: -40px;
    animation: confetti-fall ease-in forwards;
    will-change: transform, opacity;
  }
  .confetti-piece svg { display: block; }
  @keyframes confetti-fall {
    0%   { transform: translate3d(0, -40px, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translate3d(var(--drift, 0px), 110vh, 0) rotate(var(--spin, 720deg)); opacity: 1; }
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 640px) {
    body { padding: 0; }
    .app { border-radius: 0; min-height: 100vh; }
    .header { padding: 18px 14px 12px; gap: 8px; }
    .title { font-size: 24px; }
    .subtitle { font-size: 12px; }
    .points-card { padding: 8px 12px; min-width: 96px; gap: 8px; }
    .points-card .leaf-icon { width: 22px; height: 22px; }
    .points-value { font-size: 18px; }
    .points-label { font-size: 10px; }
    .progress-section { padding: 18px 18px 10px; }
    .progress-head .value { font-size: 16px; }
    .controls { padding: 14px 18px; }
    .stats-bar { margin: 0 16px 20px; padding: 18px 18px; gap: 16px; }
    .stat-icon-wrap { width: 44px; height: 44px; }
    .stat-icon-wrap svg { width: 20px; height: 20px; }
    .stat-value { font-size: 22px; }
    .celebration-banner { padding: 18px 28px; }
    .celebration-banner .ctitle { font-size: 22px; }
    .breath-instruction { bottom: 14px; padding: 8px 14px; max-width: 88%; }
    .breath-instruction .text { font-size: 11px; }
    .journey-path-bg { stroke-width: 8; stroke-dasharray: 16 16; }
    .journey-path-fill { stroke-width: 10; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="app" id="app">

    <!-- HEADER -->
    <header class="header">
      <button class="back-btn" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div class="title-block">
        <span class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
            <path d="M3 8h11a3 3 0 1 0-3-3"/>
            <path d="M3 16h15a3 3 0 1 1-3 3"/>
            <path d="M3 12h17"/>
          </svg>
        </span>
        <h1 class="title">Breath Journey</h1>
        <p class="subtitle">Breathe in rhythm. Earn points. Grow your calm.</p>
      </div>

      <div class="points-card" id="pointsCard">
        <svg class="leaf-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C20 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/>
        </svg>
        <div>
          <div class="points-value" id="headerPoints">0</div>
          <div class="points-label">Points</div>
        </div>
      </div>
    </header>

    <!-- SCENE -->
    <div class="scene" role="img" aria-label="A serene scene with floating islands, a meditator, cherry blossoms, and waterfalls. A curving golden path traces the journey across the water.">

      <!-- CURVY JOURNEY ROAD overlaid on the illustration -->
      <svg class="journey-svg"
           viewBox="0 0 1402 1122"
           preserveAspectRatio="xMidYMid slice"
           aria-hidden="true">
        <defs>
          <!-- Gold gradient for the walked portion of the road -->
          <linearGradient id="pathGradient" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0"   stop-color="#F59E0B"/>
            <stop offset="0.5" stop-color="#FBBF24"/>
            <stop offset="1"   stop-color="#FDE68A"/>
          </linearGradient>

          <!-- Soft glow filter for the gold path -->
          <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Gradient fill for "reached" milestone markers -->
          <radialGradient id="markerGradient" cx="0.5" cy="0.4" r="0.6">
            <stop offset="0"   stop-color="#FDE68A"/>
            <stop offset="1"   stop-color="#FBBF24"/>
          </radialGradient>

          <!-- Drop shadow for marker circles -->
          <filter id="markerShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.35"/>
          </filter>

          <!-- The curvy road. Coordinates flow from bottom-left
               (near the torii gate island) past the meditator's island
               and up to the cherry blossom island at top-right. -->
          <path id="journeyPathDef"
                d="M 220 920
                   C 320 870, 420 870, 540 820
                   C 620 780, 680 770, 750 790
                   C 850 770, 900 690, 950 600
                   C 1020 510, 1130 430, 1250 340" />
        </defs>

        <!-- Faint dashed background line (the road ahead) -->
        <use href="#journeyPathDef" class="journey-path-bg"/>

        <!-- Bright gold solid line (the road walked) -->
        <use href="#journeyPathDef" id="journeyPathFill" class="journey-path-fill"/>

        <!-- Milestone markers — positions calculated in JS -->
        <g id="milestoneMarkers"></g>

        <!-- "You are here" position pip — moves along the path -->
        <g id="positionMarker" class="position-marker" transform="translate(220, 920)">
          <circle class="pip-outer" r="18"/>
          <circle class="pip-inner" r="7"/>
        </g>
      </svg>

      <!-- Celebratory aura over the meditator -->
      <div class="breath-aura" id="breathAura"></div>

      <!-- Ambient drifting petals -->
      <div class="scene-petals" id="scenePetals" aria-hidden="true"></div>

      <!-- Milestone celebration banner -->
      <div class="celebration-banner" id="celebrationBanner" role="status" aria-live="polite">
        <span class="badge">★ Milestone</span>
        <div class="ctitle" id="celebTitle">You reached a milestone!</div>
        <div class="csub" id="celebSub">Your calm grows stronger.</div>
      </div>

      <!-- Breath instruction bubble -->
      <div class="breath-instruction" id="breathInstruction">
        <svg class="wind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h11a3 3 0 1 0-3-3"/>
          <path d="M3 16h15a3 3 0 1 1-3 3"/>
          <path d="M3 12h17"/>
        </svg>
        <span class="text" id="breathText">Take a breath. Tap below when you've completed your session.</span>
      </div>
    </div>

    <!-- PROGRESS LABELS (numerical companion to the on-scene road) -->
    <section class="progress-section" aria-label="Progress to next milestone">
      <div class="progress-head">
        <div class="current-ms">
          <span class="label">Current</span>
          <span class="value" id="currentMs">Start</span>
        </div>
        <div class="next-ms">
          <span class="label">Next Milestone</span>
          <span class="value" id="nextMs">1,000</span>
        </div>
      </div>

      <div class="progress-info">
        <span id="progressText">
          <strong>0</strong> / 1,000 points to your next milestone
        </span>
      </div>
    </section>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="start-btn" id="completeBtn">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span id="completeBtnText">Complete Session</span>
      </button>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-icon-wrap blue" id="sessionsIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8h11a3 3 0 1 0-3-3"/>
            <path d="M3 16h15a3 3 0 1 1-3 3"/>
            <path d="M3 12h17"/>
          </svg>
        </div>
        <div class="stat-text">
          <span class="stat-label">Sessions</span>
          <span class="stat-value" id="sessionsValue">0</span>
        </div>
      </div>

      <div class="stat-divider"></div>

      <div class="stat">
        <div class="stat-icon-wrap gold" id="pointsIcon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
        <div class="stat-text">
          <span class="stat-label">Total Points</span>
          <span class="stat-value" id="totalPointsValue">0</span>
        </div>
      </div>
    </div>

  </div>

  <div class="confetti-overlay" id="confettiOverlay" aria-hidden="true"></div>

<script>
/* =================================================================
   BREATH JOURNEY — Curvy Road Prototype
   -----------------------------------------------------------------
   Same interaction model as the simpler-bar versions, but the
   progress bar is replaced by a curvy SVG road drawn directly
   over the illustrated scene. The road's "walked" length and the
   milestone-stone positions are derived from a single SVG path,
   so changing the curve's `d` attribute reshapes everything in
   one place.
   ================================================================= */

const state = {
  totalPoints: 0,
  sessions: 0,
  pointsPerSession: 250,
  milestones: [1000, 2500, 4000, 5500, 7000, 8500, 10000, 11500, 13000, 14500],
  busy: false,
};

const SVG_NS = 'http://www.w3.org/2000/svg';

const $ = (sel) => document.querySelector(sel);
const els = {
  headerPoints:      $('#headerPoints'),
  pointsCard:        $('#pointsCard'),
  currentMs:         $('#currentMs'),
  nextMs:            $('#nextMs'),
  progressText:      $('#progressText'),
  completeBtn:       $('#completeBtn'),
  sessionsValue:     $('#sessionsValue'),
  totalPointsValue:  $('#totalPointsValue'),
  sessionsIcon:      $('#sessionsIcon'),
  pointsIcon:        $('#pointsIcon'),
  breathAura:        $('#breathAura'),
  breathText:        $('#breathText'),
  celebrationBanner: $('#celebrationBanner'),
  celebTitle:        $('#celebTitle'),
  celebSub:          $('#celebSub'),
  confettiOverlay:   $('#confettiOverlay'),
  scenePetals:       $('#scenePetals'),
  // Road / SVG
  journeyPathDef:    $('#journeyPathDef'),
  journeyPathFill:   $('#journeyPathFill'),
  milestoneGroup:    $('#milestoneMarkers'),
  positionMarker:    $('#positionMarker'),
};

const fmt = (n) => Math.round(n).toLocaleString('en-US');
const maxMilestone = () => state.milestones[state.milestones.length - 1];

function getCurrentMilestone(points) {
  let last = 0;
  for (const m of state.milestones) {
    if (m <= points) last = m;
    else break;
  }
  return last;
}
function getNextMilestone(points) {
  return state.milestones.find((m) => m > points) ?? null;
}
function milestonesCrossed(prev, next) {
  return state.milestones.filter((m) => m > prev && m <= next);
}

// -----------------------------------------------------------------
// CURVY ROAD
// -----------------------------------------------------------------
// Total length of the underlying SVG path — used to position markers
// and to animate stroke-dashoffset on the "walked" portion.
let pathLength = 0;

// Star SVG path data — drawn at marker positions when reached
const STAR_PATH_D = 'M0,-9 L2.6,-2.8 L9.5,-2 L4.5,2.5 L5.8,9.2 L0,5.8 L-5.8,9.2 L-4.5,2.5 L-9.5,-2 L-2.6,-2.8 Z';

function buildRoad() {
  pathLength = els.journeyPathDef.getTotalLength();

  // Configure the gold "walked" path: dasharray = full length,
  // dashoffset starts at full length so nothing is visible yet.
  els.journeyPathFill.style.strokeDasharray  = pathLength;
  els.journeyPathFill.style.strokeDashoffset = pathLength;

  // Place a marker stone at each milestone position along the path
  els.milestoneGroup.innerHTML = '';
  state.milestones.forEach((m) => {
    const t = m / maxMilestone();           // fraction along the path
    const p = els.journeyPathDef.getPointAtLength(pathLength * t);

    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'milestone-marker');
    g.setAttribute('transform', `translate(${p.x}, ${p.y})`);
    g.setAttribute('data-milestone', String(m));
    g.setAttribute('filter', 'url(#markerShadow)');
    g.innerHTML = `
      <circle class="marker-glow" r="28"/>
      <circle class="marker-bg"   r="20"/>
      <path   class="marker-star" d="${STAR_PATH_D}"/>
      <title>${fmt(m)} points</title>
    `;
    els.milestoneGroup.appendChild(g);
  });
}

function updateRoad() {
  const progress = Math.min(state.totalPoints / maxMilestone(), 1);

  // Animate the gold path filling along the curve
  els.journeyPathFill.style.strokeDashoffset = pathLength * (1 - progress);

  // Move the "you are here" pip to the current progress point
  const pip = els.journeyPathDef.getPointAtLength(pathLength * progress);
  els.positionMarker.setAttribute('transform', `translate(${pip.x}, ${pip.y})`);

  // Light up any markers that have been reached
  els.milestoneGroup.querySelectorAll('.milestone-marker').forEach((g) => {
    const m = parseInt(g.dataset.milestone, 10);
    g.classList.toggle('reached', state.totalPoints >= m);
  });
}

// -----------------------------------------------------------------
// RENDER (labels below the scene)
// -----------------------------------------------------------------
function renderUI() {
  const current = getCurrentMilestone(state.totalPoints);
  const next    = getNextMilestone(state.totalPoints);

  els.headerPoints.textContent     = fmt(state.totalPoints);
  els.totalPointsValue.textContent = fmt(state.totalPoints);
  els.sessionsValue.textContent    = fmt(state.sessions);

  els.currentMs.textContent = current === 0 ? 'Start' : fmt(current);
  els.nextMs.textContent    = next ? fmt(next) : 'Complete!';

  if (next) {
    const bandSize = next - current;
    const inBand   = state.totalPoints - current;
    els.progressText.innerHTML =
      `<strong>${fmt(inBand)}</strong> / ${fmt(bandSize)} points to your next milestone`;
  } else {
    els.progressText.innerHTML = `<strong>Journey complete!</strong> You've reached every milestone.`;
  }

  updateRoad();
}

// -----------------------------------------------------------------
// MICRO-ANIMATIONS
// -----------------------------------------------------------------
function pulsePointsCard() {
  els.pointsCard.classList.remove('pulse');
  void els.pointsCard.offsetWidth;
  els.pointsCard.classList.add('pulse');
}
function bumpIcon(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function celebrateAura() {
  els.breathAura.classList.remove('celebrate');
  void els.breathAura.offsetWidth;
  els.breathAura.classList.add('celebrate');
  setTimeout(() => els.breathAura.classList.remove('celebrate'), 1700);
}

// -----------------------------------------------------------------
// CONFETTI
// -----------------------------------------------------------------
const confettiColors = ['#FBBF24', '#F59E0B', '#FDE68A', '#F9A8D4', '#7DD3FC', '#86EFAC', '#FFFFFF'];

const buildStarSVG = (color, size = 20) => `
  <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" aria-hidden="true">
    <path d="M12 2l2.9 6 6.6.7-5 4.5 1.5 6.5L12 16.8 5.9 19.7 7.5 13.2 2.5 8.7 9.1 8z"/>
  </svg>`;
const buildPetalSVG = (color = '#F9A8D4', size = 14) => `
  <svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2 C16 6, 20 10, 12 22 C4 10, 8 6, 12 2 Z" fill="${color}"/>
  </svg>`;
const buildSparkSVG = (color = '#FFFFFF', size = 10) => `
  <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
  </svg>`;

function launchConfetti({ count = 100 } = {}) {
  const overlay = els.confettiOverlay;
  const vw = window.innerWidth;

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';

    piece.style.left = (Math.random() * vw) + 'px';
    piece.style.setProperty('--drift', ((Math.random() - 0.5) * 360).toFixed(0) + 'px');
    piece.style.setProperty('--spin',  ((Math.random() * 1440) - 720).toFixed(0) + 'deg');

    const duration = 2.4 + Math.random() * 2.2;
    const delay    = Math.random() * 0.6;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay    = delay + 's';

    const r = Math.random();
    const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    if (r < 0.7)      piece.innerHTML = buildStarSVG(color,  16 + Math.random() * 14);
    else if (r < 0.9) piece.innerHTML = buildPetalSVG(color, 12 + Math.random() * 10);
    else              piece.innerHTML = buildSparkSVG(color, 6  + Math.random() * 6);

    overlay.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + delay) * 1000 + 100);
  }
}

// -----------------------------------------------------------------
// CELEBRATION BANNER
// -----------------------------------------------------------------
function showCelebrationBanner(milestoneValue) {
  const idx   = state.milestones.indexOf(milestoneValue);
  const total = state.milestones.length;

  let title, sub;
  if (idx === 0) {
    title = `First milestone — ${fmt(milestoneValue)} points!`;
    sub   = 'A beautiful beginning. Keep breathing.';
  } else if (idx === total - 1) {
    title = `Journey complete — ${fmt(milestoneValue)} points!`;
    sub   = 'You\u2019ve reached every milestone.';
  } else {
    title = `You reached ${fmt(milestoneValue)} points!`;
    sub   = `Milestone ${idx + 1} of ${total} — your calm grows stronger.`;
  }

  els.celebTitle.textContent = title;
  els.celebSub.textContent   = sub;
  els.celebrationBanner.classList.add('show');
  setTimeout(() => els.celebrationBanner.classList.remove('show'), 2600);
}

// -----------------------------------------------------------------
// SESSION COMPLETION
// -----------------------------------------------------------------
function completeSession() {
  if (state.busy) return;

  if (getNextMilestone(state.totalPoints) === null) {
    els.breathText.style.opacity = '0';
    setTimeout(() => {
      els.breathText.textContent = 'You\u2019ve reached every milestone. A new path may begin soon.';
      els.breathText.style.opacity = '1';
    }, 200);
    return;
  }

  state.busy = true;
  els.completeBtn.disabled = true;

  const prevPoints = state.totalPoints;
  const newPoints  = prevPoints + state.pointsPerSession;
  state.totalPoints = newPoints;
  state.sessions   += 1;

  const crossed = milestonesCrossed(prevPoints, newPoints);

  renderUI();
  pulsePointsCard();
  bumpIcon(els.pointsIcon);
  bumpIcon(els.sessionsIcon);
  celebrateAura();

  els.breathText.style.opacity = '0';
  setTimeout(() => {
    els.breathText.textContent =
      crossed.length > 0
        ? `Beautiful work. +${state.pointsPerSession} points — and a milestone reached!`
        : `Beautiful. +${state.pointsPerSession} points earned this session.`;
    els.breathText.style.opacity = '1';
  }, 200);

  crossed.forEach((milestone, idx) => {
    setTimeout(() => {
      launchConfetti({ count: 110 });
      showCelebrationBanner(milestone);
    }, idx * 700);
  });

  setTimeout(() => {
    state.busy = false;
    els.completeBtn.disabled = false;
  }, 500);
}

// -----------------------------------------------------------------
// AMBIENT PETALS
// -----------------------------------------------------------------
function spawnScenePetals(amount) {
  for (let i = 0; i < amount; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';

    const startX = Math.random() * 100;
    const drift  = (Math.random() - 0.5) * 120;
    const dur    = 7 + Math.random() * 6;
    const delay  = Math.random() * 4;
    const size   = 8 + Math.random() * 8;

    petal.style.left   = startX + '%';
    petal.style.width  = size + 'px';
    petal.style.height = size + 'px';
    petal.style.setProperty('--drift', drift + 'px');
    petal.style.animationDuration = dur + 's';
    petal.style.animationDelay    = delay + 's';

    els.scenePetals.appendChild(petal);
    setTimeout(() => petal.remove(), (dur + delay) * 1000 + 200);
  }
}
setInterval(() => {
  if (els.scenePetals.children.length < 3) spawnScenePetals(2);
}, 3500);

// -----------------------------------------------------------------
// EVENTS
// -----------------------------------------------------------------
els.completeBtn.addEventListener('click', completeSession);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !state.busy) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault();
      completeSession();
    }
  }
});

// -----------------------------------------------------------------
// INIT — wait for fonts/SVG layout before measuring the path
// -----------------------------------------------------------------
function init() {
  buildRoad();
  renderUI();
  spawnScenePetals(5);
}

// Some browsers need a paint cycle before getTotalLength returns
// accurate values for newly inserted paths — small defer is safest.
if (document.readyState === 'complete') {
  requestAnimationFrame(init);
} else {
  window.addEventListener('load', () => requestAnimationFrame(init));
}
</script>
</body>
</html>
